    <meta charset="UTF-8" />

    <meta name="theme-color" content="#10111d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Merge PDFs, convert images to PDF, split, rotate and compress — privately on your device. GattaiMate is your modern document toolkit." />
    <link rel="icon" type="image/svg+xml" href="/gattaimate-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      try { var t = localStorage.getItem("gattaimate.theme"); if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <title>GattaiMate — Complete PDF Toolkit</title>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
